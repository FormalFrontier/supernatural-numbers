version: "v0.4"

project:
  name: "Supernatural Numbers"
  description: >-
    Prime-exponent supernatural arithmetic, finite-quotient profinite orders
    and indices of closed subgroups, a closed-subgroup tower law, and the
    torsion-order comparison with profinite rational-circle character groups.
  authors:
    - "Formal Frontier Agents"
  license: "Apache-2.0"

sources:
  - title: "Cohomology of Number Fields"
    authors:
      - "Jürgen Neukirch"
      - "Alexander Schmidt"
      - "Kay Wingberg"
    type: "book"
    location: "Corrected second edition, version 2.3 (May 2020), Definitions (1.1.5)--(1.1.6) and the following consequences"
    relationship: "adapts"
    note: >-
      Mathematical background for prime-exponent arithmetic, finite-quotient
      orders and indices, the closed-subgroup tower and character comparison.
      This is attribution of mathematical content, not permission to reproduce
      book material or a source-coverage claim; no book assets are shipped.
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Reuses mathlib's prime factorization, finite group, profinite group,
      and Pontryagin-duality libraries at the revision pinned in lakefile.toml.
  - id: "https://github.com/FormalFrontier/group-theory"
    relationship: "builds-on"
    note: >-
      Reuses the released canonical rational-circle inclusions and finite-order
      preimage results, following their original formalization in this library.

automation:
  methods:
    - method: "agent"
      framework: "Codex CLI (Formal Frontier Hive), Lean 4 and mathlib"
      tool_setup: >-
        AI agents using Codex CLI, Lean 4 and mathlib developed the mathematical
        library, checked clients, metadata, bottom/simplification work and the
        doc-gen4 Markdown adapter. Beacon assembled the original modules,
        notices and corrections; Folio contributed headline exposition.
        Exact model versions and total costs were not recorded here.
  notes: >-
    Formal Frontier Agents is the collective formalization credit. Beacon
    is an AI-agent contributor, not a separately identified human author.
    Beacon's original modules, other AI-agent client/metadata/bottom and
    documentation contributions, Folio's headline exposition and the adapter's
    Root Stability/Anchor Ideal recipe lineage are credited in README.md and
    docs/README.md. Apache notices, collective credit and genuine third-party
    attribution are preserved; the collective author credit does not identify
    a copyright holder. The generated API includes displayed Lean signatures
    and project docstrings, not external book text.

status:
  scope: >-
    Reusable supernatural-number arithmetic, finite-quotient profinite
    order and closed-subgroup index, their tower law, and torsion-character
    comparison under the hypotheses declared in Lean. This metadata does not
    assert complete source coverage or certify any particular release snapshot.

review:
  status: "self-assessed"
  notes: >-
    Compilation checks, including warning-fatal builds, are distinct from
    complete transitive standard-axiom verification, including private and
    generated declarations. Neither schema validation nor this self-assessment
    constitutes independent mathematical review, rights assessment or
    certification of a particular revision or its publication status.
