version: "v0.4"

project:
  name: "Supernatural Numbers"
  description: >-
    Prime-exponent supernatural arithmetic, finite-quotient profinite orders
    and indices of closed subgroups, a closed-subgroup tower law, and the
    torsion-order comparison with profinite rational-circle character groups.
  authors:
    - "Formal Frontier Agents"
  license: "Apache-2.0"

sources:
  - title: "Cohomology of Number Fields"
    authors:
      - "Jürgen Neukirch"
      - "Alexander Schmidt"
      - "Kay Wingberg"
    type: "book"
    location: "Corrected second edition, version 2.3 (May 2020), Definitions (1.1.5)--(1.1.6) and the following consequences"
    relationship: "adapts"
    note: >-
      Mathematical background for prime-exponent arithmetic, finite-quotient
      orders and indices, the closed-subgroup tower and character comparison.
      This is attribution of mathematical content, not permission to reproduce
      book material or a source-coverage claim; no book assets are shipped.
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Reuses mathlib's prime factorization, finite group, profinite group,
      and Pontryagin-duality libraries at the revision pinned in lakefile.toml.

automation:
  methods:
    - method: "agent"
      framework: "Formal Frontier Hive Tasks, Codex CLI, Lean 4 and mathlib"
      tool_setup: >-
        AI agent Beacon authored the initial mathematical library and the
        worker-b AI agent prepared downstream clients, readiness metadata and
        the new complete-lattice bottom theorem and simplification repair.
        Beacon assembled the notice and status corrections. The separate
        worker-b Hive Task hive-request-64db144d6c068a16068b0f8d7266fa30d0f8d322
        prepared native doc-gen4 Markdown documentation and bounded validation
        tooling. Lean checked the accepted ordinary candidate; final-head
        whole-artifact checks and fresh independent release review remain
        required. Exact model versions and total costs were not recorded here.
  notes: >-
    Formal Frontier Agents is the collective formalization credit. Beacon
    is an AI-agent contributor, not a separately identified human author.
    Original Beacon module revisions and later worker-b contributions are
    identified in README.md. Five unsupported project-generated ownership
    assertions were removed while retaining their historical records, Apache
    notices and actual contributor credit. Genuine third-party attribution
    remains protected; collective credit does not establish copyright ownership.
    The generated API copies only native displayed signatures and project
    docstrings; the exact donor recipe lineage is documented in docs/README.md.

status:
  scope: >-
    Reusable supernatural-number arithmetic, finite-quotient profinite
    order and closed-subgroup index, their tower law, and torsion-character
    comparison under the hypotheses declared in Lean. No complete source
    coverage or official release is asserted.

review:
  status: "self-assessed"
  notes: >-
    As recorded September 25, 2026, ordinary acceptance issue 12 / 40303 and
    integration 40306 apply to the library, bot_eq_one, simplifier changes,
    clients, notices, license and earlier metadata at internal main commit
    cc3e8d151c87585111df3abe6d2c40d9f10971c6 (tree
    15e99ee28ce447f921b0e74f9ad71e3ce85509b5). The new native API,
    tooling and metadata revision are not thereby accepted: their whole final
    candidate needs fresh independent review, rights assessment and proof
    evidence applicability. The complete private/generated declaration and
    stored-proof audit, exact release acceptance and publication are separate.
    This author-time report is not a live release registry; schema validation
    and ordinary development acceptance do not certify an official release.
